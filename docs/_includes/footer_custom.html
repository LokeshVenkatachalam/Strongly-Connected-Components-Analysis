<script>
document.addEventListener('DOMContentLoaded', function() {
  // Inject "Maintained by" into ALL sidebar footers 
  var footers = document.querySelectorAll('header.side-bar .site-footer, .side-bar .d-md-block.site-footer');
  if (footers.length === 0) {
    // Fallback: find any .site-footer inside the sidebar header
    footers = document.querySelectorAll('.side-bar div[class*="site-footer"]');
  }
  footers.forEach(function(f) {
    if (f.querySelector('.site-footer-maintainer')) return; // already added
    var el = document.createElement('div');
    el.className = 'site-footer-maintainer';
    el.innerHTML = 'Maintained by <a href="https://github.com/LokeshVenkatachalam">Lokesh Venkatachalam</a>';
    f.insertBefore(el, f.firstChild);
    f.style.display = 'block'; // ensure visible
  });
});
</script>
