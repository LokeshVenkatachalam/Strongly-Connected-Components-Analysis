<script>
(function(){
  var histogramColors = ['#22c55e', '#06b6d4', '#6366f1', '#8b5cf6', '#ec4899', '#f97316', '#eab308'];

  function parseNumericValue(text) {
    if (!text) return NaN;
    var cleaned = text.trim().replace(/,/g, '');
    var match = cleaned.match(/^[-+]?\d+(?:\.\d+)?/);
    if (!match) return NaN;

    var value = parseFloat(match[0]);
    if (/ms\b/i.test(cleaned)) return value;
    if (/s\b/i.test(cleaned) && !/ms\b/i.test(cleaned)) return value * 1000;
    if (/gb\b/i.test(cleaned)) return value * 1e9;
    if (/mb\b/i.test(cleaned) && !/ms\b/i.test(cleaned)) return value * 1e6;
    if (/kb\b/i.test(cleaned)) return value * 1e3;
    if (/b\b/i.test(cleaned) && !/gb\b/i.test(cleaned)) return value * 1e9;
    if (/m\b/i.test(cleaned) && !/ms\b/i.test(cleaned)) return value * 1e6;
    if (/k\b/i.test(cleaned)) return value * 1e3;
    return value;
  }

  function quantile(sortedValues, ratio) {
    if (!sortedValues.length) return NaN;
    var index = (sortedValues.length - 1) * ratio;
    var lower = Math.floor(index);
    var upper = Math.ceil(index);
    if (lower === upper) return sortedValues[lower];
    return sortedValues[lower] + (sortedValues[upper] - sortedValues[lower]) * (index - lower);
  }

  function applyCellClass(cell, className) {
    cell.classList.remove('cell-good', 'cell-mid', 'cell-bad', 'cell-info-low', 'cell-info-mid', 'cell-info-high');
    cell.classList.add(className);
  }

  function classifyHeader(text) {
    var header = (text || '').toLowerCase().trim();
    if (!header || header === '#') return 'text';
    if (/graph|algorithm|year|venue|approach|code|category|examples|file|format|used by|methods|bucket/.test(header)) return 'text';
    if (/speedup|wins|win count|largest scc %|share|ratio|accuracy/.test(header) || /%/.test(header)) return 'high-good';
    if (/load|thread|par-scc|wang|gbbs|ispan|time|\bms\b|seconds?/.test(header)) return 'low-good';
    return 'neutral';
  }

  function ensureThemeToggle() {
    if (document.querySelector('.theme-toggle')) return;
    var button = document.createElement('button');
    button.className = 'theme-toggle';
    var isLight = localStorage.getItem('theme') === 'light';

    if (isLight) {
      document.body.classList.add('light-mode');
    }

    function updateLabel(lightMode) {
      button.textContent = lightMode ? 'Dark mode' : 'Light mode';
    }

    updateLabel(isLight);
    document.body.appendChild(button);

    button.onclick = function() {
      document.body.classList.toggle('light-mode');
      var nextIsLight = document.body.classList.contains('light-mode');
      localStorage.setItem('theme', nextIsLight ? 'light' : 'dark');
      updateLabel(nextIsLight);
    };
  }

  function ensureMaintainerFooter() {
    var footer = document.querySelector('.side-bar .site-footer');
    if (!footer) return;
    footer.style.setProperty('display', 'block', 'important');

    if (footer.textContent.indexOf('Lokesh Venkatachalam') !== -1) return;

    var maintainer = document.createElement('div');
    maintainer.className = 'site-footer-maintainer';
    maintainer.innerHTML = 'Maintained by <a href="https://github.com/LokeshVenkatachalam">Lokesh Venkatachalam</a>';
    footer.insertBefore(maintainer, footer.firstChild);
  }

  function parseHistogramBuckets(text) {
    var parts = text.indexOf('|') >= 0 ? text.split('|') : [text];
    var buckets = [];

    parts.forEach(function(part) {
      var match = part.trim().match(/^(.+?)\u2192([\d,]+)$/);
      if (!match) return;
      buckets.push({
        label: match[1].trim(),
        count: parseInt(match[2].replace(/,/g, ''), 10)
      });
    });

    return buckets;
  }

  function renderHistogramTables() {
    document.querySelectorAll('.main-content p').forEach(function(paragraph) {
      if (paragraph.dataset.histogramReady === 'true') return;

      var code = paragraph.querySelector('code');
      if (!code) return;

      var rawText = code.textContent || '';
      if (rawText.indexOf('\u2192') === -1) return;

      var buckets = parseHistogramBuckets(rawText);
      if (!buckets.length || !paragraph.parentNode) return;

      var titleText = paragraph.textContent.replace(rawText, '').trim().replace(/:\s*$/, '');
      var total = buckets.reduce(function(sum, bucket) {
        return sum + bucket.count;
      }, 0);

      var card = document.createElement('div');
      card.className = 'histogram-card';

      var title = document.createElement('div');
      title.className = 'histogram-title';
      title.textContent = titleText;
      card.appendChild(title);

      var table = document.createElement('table');
      table.className = 'hist-table';
      table.innerHTML = '<thead><tr><th>Bucket</th><th>Count</th><th>Share</th></tr></thead><tbody></tbody>';

      var tbody = table.querySelector('tbody');
      buckets.forEach(function(bucket, index) {
        var row = document.createElement('tr');

        var labelCell = document.createElement('td');
        var swatch = document.createElement('span');
        swatch.className = 'hist-swatch';
        swatch.style.backgroundColor = histogramColors[index % histogramColors.length];
        labelCell.appendChild(swatch);
        labelCell.appendChild(document.createTextNode(bucket.label));

        var countCell = document.createElement('td');
        countCell.textContent = bucket.count.toLocaleString();

        var shareCell = document.createElement('td');
        shareCell.textContent = total ? ((bucket.count / total) * 100).toFixed(2) + '%' : '0.00%';

        row.appendChild(labelCell);
        row.appendChild(countCell);
        row.appendChild(shareCell);
        tbody.appendChild(row);
      });

      card.appendChild(table);
      paragraph.dataset.histogramReady = 'true';
      paragraph.parentNode.replaceChild(card, paragraph);
    });
  }

  function getHeaderRow(table) {
    if (table.tHead && table.tHead.rows.length) return table.tHead.rows[0];
    return table.rows.length ? table.rows[0] : null;
  }

  function getBodyRows(table) {
    if (table.tBodies && table.tBodies.length) {
      return Array.prototype.slice.call(table.tBodies[0].rows);
    }
    return Array.prototype.slice.call(table.rows, 1);
  }

  function getCellText(row, index) {
    var cell = row.cells[index];
    return cell ? cell.textContent.trim() : '';
  }

  function isNumericColumn(rows, index) {
    var total = 0;
    var numeric = 0;

    rows.forEach(function(row) {
      var text = getCellText(row, index);
      if (!text) return;
      total += 1;
      if (!isNaN(parseNumericValue(text))) numeric += 1;
    });

    return total > 0 && numeric >= Math.max(2, Math.ceil(total / 2));
  }

  function sortTableByColumn(table, index) {
    var headerRow = getHeaderRow(table);
    if (!headerRow) return;

    var headers = Array.prototype.slice.call(headerRow.cells);
    var activeHeader = headers[index];
    var direction = activeHeader.getAttribute('aria-sort') === 'ascending' ? 'descending' : 'ascending';
    var rows = getBodyRows(table);
    if (rows.length < 2) return;

    var numeric = isNumericColumn(rows, index);
    headers.forEach(function(header) {
      header.removeAttribute('aria-sort');
    });
    activeHeader.setAttribute('aria-sort', direction);

    rows.sort(function(rowA, rowB) {
      var textA = getCellText(rowA, index);
      var textB = getCellText(rowB, index);

      if (numeric) {
        var valueA = parseNumericValue(textA);
        var valueB = parseNumericValue(textB);
        if (isNaN(valueA) && isNaN(valueB)) return 0;
        if (isNaN(valueA)) return 1;
        if (isNaN(valueB)) return -1;
        return direction === 'ascending' ? valueA - valueB : valueB - valueA;
      }

      var comparison = textA.localeCompare(textB, undefined, { numeric: true, sensitivity: 'base' });
      return direction === 'ascending' ? comparison : -comparison;
    });

    var body = table.tBodies && table.tBodies.length ? table.tBodies[0] : table;
    rows.forEach(function(row) {
      body.appendChild(row);
    });
  }

  function makeTablesSortable() {
    document.querySelectorAll('.main-content table').forEach(function(table) {
      if (table.dataset.sortReady === 'true') return;

      var headerRow = getHeaderRow(table);
      if (!headerRow || headerRow.cells.length < 2) return;

      table.classList.add('sortable-table');
      Array.prototype.forEach.call(headerRow.cells, function(headerCell, index) {
        headerCell.setAttribute('title', 'Click to sort');
        headerCell.setAttribute('tabindex', '0');
        headerCell.setAttribute('role', 'button');

        headerCell.addEventListener('click', function() {
          sortTableByColumn(table, index);
        });

        headerCell.addEventListener('keydown', function(event) {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            sortTableByColumn(table, index);
          }
        });
      });

      table.dataset.sortReady = 'true';
    });
  }

  function applyResultColoring() {
    document.querySelectorAll('.main-content table').forEach(function(table) {
      var headerRow = getHeaderRow(table);
      if (!headerRow) return;

      var rows = getBodyRows(table);
      if (!rows.length) return;

      Array.prototype.forEach.call(headerRow.cells, function(headerCell, index) {
        var mode = classifyHeader(headerCell.textContent);
        if (mode === 'text') return;

        var values = [];
        var items = [];
        rows.forEach(function(row) {
          var cell = row.cells[index];
          if (!cell) return;
          var value = parseNumericValue(cell.textContent);
          if (isNaN(value)) return;
          values.push(value);
          items.push({ cell: cell, value: value });
        });

        if (items.length < 2) return;

        values.sort(function(a, b) { return a - b; });
        var low = quantile(values, 0.33);
        var high = quantile(values, 0.66);

        items.forEach(function(item) {
          if (mode === 'low-good') {
            if (item.value <= low) applyCellClass(item.cell, 'cell-good');
            else if (item.value >= high) applyCellClass(item.cell, 'cell-bad');
            else applyCellClass(item.cell, 'cell-mid');
            return;
          }

          if (mode === 'high-good') {
            if (item.value >= high) applyCellClass(item.cell, 'cell-good');
            else if (item.value <= low) applyCellClass(item.cell, 'cell-bad');
            else applyCellClass(item.cell, 'cell-mid');
            return;
          }

          if (item.value >= high) applyCellClass(item.cell, 'cell-info-high');
          else if (item.value <= low) applyCellClass(item.cell, 'cell-info-low');
          else applyCellClass(item.cell, 'cell-info-mid');
        });
      });
    });
  }

  function initSiteEnhancements() {
    ensureThemeToggle();
    ensureMaintainerFooter();
    renderHistogramTables();
    makeTablesSortable();
    applyResultColoring();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initSiteEnhancements);
  } else {
    initSiteEnhancements();
  }
  window.addEventListener('load', initSiteEnhancements);
})();
</script>
