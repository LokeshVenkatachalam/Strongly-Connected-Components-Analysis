<!-- Force browser to check for updates -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="icon" type="image/png" href="{{ '/assets/favicons/LV-graph2.png' | relative_url }}">
<link rel="shortcut icon" href="{{ '/assets/favicons/LV-graph2.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/favicons/LV-graph2.png' | relative_url }}">

<style>
/* Sort indicators */
.sortable-table th {
  cursor: pointer;
  user-select: none;
  position: relative;
  padding-right: 1.4rem !important;
}
.sortable-table th:hover { background: rgba(148, 163, 184, 0.12); }
.sortable-table th::after {
  content: " ⇅";
  font-size: 0.72em;
  opacity: 0.35;
  position: absolute;
  right: 0.45rem;
}
.sortable-table th[aria-sort=ascending]::after { content: " ▲"; opacity: 0.8; }
.sortable-table th[aria-sort=descending]::after { content: " ▼"; opacity: 0.8; }

/* Favicon preview cards */
.favicon-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 1rem;
  margin: 1rem 0 1.5rem;
}
.favicon-card {
  border: 1px solid rgba(148, 163, 184, 0.22);
  border-radius: 12px;
  padding: 1rem 0.9rem;
  text-align: center;
  background: rgba(15, 23, 42, 0.22);
}
.favicon-card.active {
  border-color: rgba(52, 211, 153, 0.7);
  box-shadow: inset 0 0 0 1px rgba(52, 211, 153, 0.18);
}
.favicon-card img {
  width: 72px;
  height: 72px;
  display: block;
  margin: 0 auto 0.7rem;
}
.favicon-card strong {
  display: block;
  margin-bottom: 0.35rem;
}
.favicon-card p {
  margin: 0.35rem 0 0;
  font-size: 0.82rem;
  opacity: 0.8;
}
body.light-mode .favicon-card {
  background: #f8fafc;
  border-color: rgba(15, 23, 42, 0.12);
}
body.light-mode .favicon-card.active {
  border-color: rgba(5, 150, 105, 0.65);
  box-shadow: inset 0 0 0 1px rgba(5, 150, 105, 0.16);
}

/* Result color coding */
.cell-good,
.cell-mid,
.cell-bad,
.cell-info-low,
.cell-info-mid,
.cell-info-high {
  background: transparent !important;
}
.cell-good {
  color: #4ade80 !important;
  font-weight: 600;
}
.cell-mid {
  color: #f59e0b !important;
  font-weight: 600;
}
.cell-bad {
  color: #f87171 !important;
  font-weight: 600;
}
.cell-info-low { color: #93c5fd !important; }
.cell-info-mid {
  color: #60a5fa !important;
  font-weight: 500;
}
.cell-info-high {
  color: #dbeafe !important;
  font-weight: 600;
}
body.light-mode .cell-good {
  color: #14532d !important;
}
body.light-mode .cell-mid {
  color: #92400e !important;
}
body.light-mode .cell-bad {
  color: #991b1b !important;
}
body.light-mode .cell-info-low { color: #1d4ed8 !important; }
body.light-mode .cell-info-mid {
  color: #1e40af !important;
}
body.light-mode .cell-info-high {
  color: #1e3a8a !important;
  font-weight: 700;
}

/* Larger commands in docs */
.main-content pre {
  font-size: 1rem !important;
  line-height: 1.6;
}
.main-content pre code { font-size: 0.98rem !important; }
.main-content :not(pre) > code { font-size: 0.92em !important; }
</style>
