<!-- Force browser to check for updates -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

<style>
/* Sort indicators */
.sortable-table th {
  cursor: pointer;
  user-select: none;
  position: relative;
  padding-right: 1.4rem !important;
}
.sortable-table th:hover { background: rgba(148, 163, 184, 0.12); }
.sortable-table th::after {
  content: " ⇅";
  font-size: 0.72em;
  opacity: 0.35;
  position: absolute;
  right: 0.45rem;
}
.sortable-table th[aria-sort=ascending]::after { content: " ▲"; opacity: 0.8; }

/* Histogram tables */
.histogram-card {
  margin: 0.85rem 0 1.25rem;

  background: rgba(15, 23, 42, 0.24);
}
.histogram-title {
  font-weight: 600;
  margin-bottom: 0.6rem;
}
.hist-table {

  margin: 0 !important;
  font-size: 0.8rem;
}
.hist-table td,
.hist-table th {
  padding: 0.35rem 0.55rem !important;
}

  display: inline-block;
  width: 0.72rem;
  height: 0.72rem;
  border-radius: 999px;
  margin-right: 0.45rem;
  vertical-align: middle;
}
