name: Sequential SCC baselines

on:
  push:
    paths:
      - "algorithms/sequential-baselines/**"
      - ".github/workflows/sequential-baselines.yml"
  pull_request:
    paths:
      - "algorithms/sequential-baselines/**"
      - ".github/workflows/sequential-baselines.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build and test sequential SCC algorithms
        run: make -C algorithms/sequential-baselines check
      - name: Run sequential baselines with ASan and UBSan
        working-directory: algorithms/sequential-baselines
        run: |
          make clean
          make \
            CXXFLAGS="-O1 -g -std=c++17 -Wall -Wextra -Wpedantic -fsanitize=address,undefined" \
            all scc_self_test
          ASAN_OPTIONS=detect_leaks=1 \
            ./scc_self_test
          ./exact_scc --arithmetic-test
          ASAN_OPTIONS=detect_leaks=1 \
            python3 tests/test_bgr_cli.py \
              ./scc_compare ./scc_benchmark ./exact_scc
